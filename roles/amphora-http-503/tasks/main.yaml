---
# amphora-http-503: HTTP LB with an empty pool (all requests → 503)
#
# Same as amphora-http but skips member discovery and creation so the
# pool has zero members and every request receives 503 Service Unavailable.

# --- Step 1: Clean up any existing LB with the same name ---

- name: Find existing load balancers with name {{ lb_name }}
  ansible.builtin.shell:
    cmd: >-
      openstack loadbalancer list --os-cloud {{ os_cloud }}
      --name {{ lb_name }} -f value -c id
  register: existing_lbs
  changed_when: false

- name: Delete existing load balancers
  ansible.builtin.command:
    cmd: >-
      openstack loadbalancer delete --os-cloud {{ os_cloud }}
      {{ item }} --cascade --wait
  loop: "{{ existing_lbs.stdout_lines }}"
  failed_when: false

- name: Clean up orphaned VIP port
  ansible.builtin.shell:
    cmd: >-
      openstack port list --os-cloud {{ os_cloud }}
      --network {{ vip_network_name }} --fixed-ip ip-address={{ vip_address }}
      -f value -c ID | xargs -r openstack port delete --os-cloud {{ os_cloud }}
  failed_when: false
  changed_when: false

# --- Step 2: Get VIP subnet ID ---

- name: Get VIP subnet ID
  ansible.builtin.command:
    cmd: openstack subnet show --os-cloud {{ os_cloud }} {{ vip_subnet_name }} -f value -c id
  register: vip_subnet_result
  changed_when: false

- name: Set VIP subnet ID fact
  ansible.builtin.set_fact:
    vip_subnet_id: "{{ vip_subnet_result.stdout | trim }}"

# --- Step 3: Create load balancer ---

- name: Create load balancer
  ansible.builtin.command:
    cmd: >-
      openstack loadbalancer create --os-cloud {{ os_cloud }}
      --name {{ lb_name }}
      --vip-subnet-id {{ vip_subnet_id }}
      --vip-address {{ vip_address }}
      --flavor {{ lb_flavor }}
      --availability-zone {{ lb_az }}
      --wait
  register: lb_create

- name: Get load balancer ID
  ansible.builtin.command:
    cmd: openstack loadbalancer show --os-cloud {{ os_cloud }} {{ lb_name }} -f value -c id
  register: lb_id_result
  changed_when: false

- name: Set LB ID fact
  ansible.builtin.set_fact:
    lb_id: "{{ lb_id_result.stdout | trim }}"

# --- Step 4: Create HTTP listener on port 80 ---

- name: Create HTTP listener
  ansible.builtin.command:
    cmd: >-
      openstack loadbalancer listener create --os-cloud {{ os_cloud }}
      --name listener-{{ lb_name }}-{{ listener_protocol }}-{{ listener_port }}
      --protocol {{ listener_protocol }}
      --protocol-port {{ listener_port }}
      --connection-limit {{ connection_limit }}
      {{ lb_id }}
      --wait

- name: Get listener ID
  ansible.builtin.command:
    cmd: >-
      openstack loadbalancer listener list --os-cloud {{ os_cloud }}
      --loadbalancer {{ lb_id }} -f value -c id
  register: listener_id_result
  changed_when: false

- name: Set listener ID fact
  ansible.builtin.set_fact:
    listener_id: "{{ listener_id_result.stdout | trim }}"

# --- Step 5: Create pool (no members — triggers 503 for all requests) ---

- name: Create pool
  ansible.builtin.command:
    cmd: >-
      openstack loadbalancer pool create --os-cloud {{ os_cloud }}
      --name pool-{{ listener_protocol }}-{{ lb_name }}
      --listener {{ listener_id }}
      --protocol {{ listener_protocol }}
      --lb-algorithm {{ lb_algorithm }}
      --wait

- name: Display load balancer summary
  ansible.builtin.debug:
    msg: >-
      LB '{{ lb_name }}' created in AZ '{{ lb_az }}' with an empty pool
      (no members). All requests will return 503 Service Unavailable.

- name: Create Prometheus metrics listener
  ansible.builtin.command:
    cmd: >-
      openstack loadbalancer listener create --os-cloud {{ os_cloud }}
      --name listener-{{ lb_name }}-prometheus
      --protocol PROMETHEUS
      --protocol-port {{ prometheus_listener_port }}
      {{ lb_id }}
      --wait
