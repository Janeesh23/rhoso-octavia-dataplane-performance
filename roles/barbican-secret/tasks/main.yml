---
- name: Check if Barbican secret already exists
  ansible.builtin.shell:
    cmd: openstack secret list | grep -q {{ barbican_secret_name }}
  environment:
    OS_CLOUD: "{{ os_cloud }}"
  register: secret_check
  changed_when: false
  failed_when: false

- name: Read server.p12 and base64-encode it
  ansible.builtin.slurp:
    src: "{{ barbican_p12_path }}"
  register: p12_content
  when: secret_check.rc != 0

- name: Store TLS secret in Barbican
  ansible.builtin.command:
    cmd: >-
      openstack secret store
      --name '{{ barbican_secret_name }}'
      -t '{{ barbican_secret_type }}'
      -e '{{ barbican_secret_encoding }}'
      --payload '{{ p12_content.content }}'
  environment:
    OS_CLOUD: "{{ os_cloud }}"
  when: secret_check.rc != 0
