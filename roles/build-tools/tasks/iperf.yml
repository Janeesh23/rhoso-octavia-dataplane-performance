---
# --- Build iperf3 from source ---
- name: Download iperf3 {{ iperf3_version }} source
  ansible.builtin.get_url:
    url: "https://github.com/esnet/iperf/archive/refs/tags/{{ iperf3_version }}.tar.gz"
    dest: "/tmp/iperf3-{{ iperf3_version }}.tar.gz"
    mode: "0644"

- name: Extract iperf3 source
  ansible.builtin.unarchive:
    src: "/tmp/iperf3-{{ iperf3_version }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/iperf-{{ iperf3_version }}"

- name: Configure iperf3
  ansible.builtin.command:
    cmd: ./configure
    chdir: "/tmp/iperf-{{ iperf3_version }}"
    creates: "/tmp/iperf-{{ iperf3_version }}/Makefile"

- name: Build iperf3
  ansible.builtin.command:
    cmd: make
    chdir: "/tmp/iperf-{{ iperf3_version }}"
    creates: "/tmp/iperf-{{ iperf3_version }}/src/.libs/iperf3"

- name: Install iperf3
  ansible.builtin.command:
    cmd: make install
    chdir: "/tmp/iperf-{{ iperf3_version }}"
    creates: /usr/local/bin/iperf3

- name: Update library cache
  ansible.builtin.command:
    cmd: ldconfig
  changed_when: false

- name: Symlink iperf3 to /usr/bin if needed
  ansible.builtin.file:
    src: /usr/local/bin/iperf3
    dest: /usr/bin/iperf3
    state: link
    force: true

# --- systemd services ---
- name: Install iperf3-5201 systemd unit
  ansible.builtin.template:
    src: iperf3-5201.service.j2
    dest: /usr/lib/systemd/system/iperf3-5201.service
    mode: "0644"
  notify: reload systemd

- name: Install iperf-5001 systemd unit
  ansible.builtin.template:
    src: iperf-5001.service.j2
    dest: /usr/lib/systemd/system/iperf-5001.service
    mode: "0644"
  notify: reload systemd

- name: Enable and start iperf services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: restarted
    daemon_reload: true
  loop:
    - iperf3-5201
    - iperf-5001
