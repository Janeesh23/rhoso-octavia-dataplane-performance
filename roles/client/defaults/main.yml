---
os_cloud: default

keypair_name: me
keypair_private_key_path: "~/.ssh/id_rsa.me"
keypair_public_key_path: "~/.ssh/id_rsa.me.pub"

image_name: centos-9-stream

flavor_name: "f-{{ client_vm_vcpus }}vcpu"
flavors:
  - name: "{{ flavor_name }}"
    ram: "{{ (client_vm_ram_gb | int) * 1024 }}"
    vcpus: "{{ client_vm_vcpus | int }}"
    disk: "{{ client_vm_disk_gb | int }}"

client_network_name: vip-network
external_network_name: public
security_group_name: vip-sg
client_az: client_az

client_names:
  - kakashi-client1

security_group_rules:
  - protocol: tcp
    port_range_min: 22
    port_range_max: 22
    direction: ingress
  - protocol: icmp
    direction: ingress
  - protocol: udp
    port_range_min: 5201
    port_range_max: 5201
    direction: ingress
