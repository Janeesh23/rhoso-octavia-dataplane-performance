---
os_cloud: default

keypair_name: me
keypair_private_key_path: "~/.ssh/id_rsa.me"
keypair_public_key_path: "~/.ssh/id_rsa.me.pub"

image_name: centos-9-stream

# Single knob for client/member Nova flavor size (override with -e vm_vcpus=4).
# RAM defaults to 1 GB per vCPU; override independently with -e vm_ram_gb=8.
vm_vcpus: 32
vm_ram_gb: "{{ vm_vcpus | int }}"
vm_disk_gb: 10
flavor_name: "f-{{ vm_vcpus }}vcpu"
flavors:
  - name: "{{ flavor_name }}"
    ram: "{{ (vm_ram_gb | int) * 1024 }}"
    vcpus: "{{ vm_vcpus | int }}"
    disk: "{{ vm_disk_gb | int }}"

client_network_name: vip-network
external_network_name: public
security_group_name: vip-sg
client_az: client_az

client_names:
  - kakashi-client1

security_group_rules:
  - protocol: tcp
    port_range_min: 22
    port_range_max: 22
    direction: ingress
  - protocol: icmp
    direction: ingress
  - protocol: udp
    port_range_min: 5201
    port_range_max: 5201
    direction: ingress
