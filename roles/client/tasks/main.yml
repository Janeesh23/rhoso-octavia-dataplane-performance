---
- name: Create flavors
  openstack.cloud.compute_flavor:
    cloud: "{{ os_cloud }}"
    name: "{{ item.name }}"
    ram: "{{ item.ram }}"
    vcpus: "{{ item.vcpus }}"
    disk: "{{ item.disk }}"
    state: present
  loop: "{{ flavors }}"

- name: Delete security group if it exists
  openstack.cloud.security_group:
    cloud: "{{ os_cloud }}"
    name: "{{ security_group_name }}"
    state: absent
  ignore_errors: true

- name: Create security group
  openstack.cloud.security_group:
    cloud: "{{ os_cloud }}"
    name: "{{ security_group_name }}"
    state: present

- name: Create security group rules
  openstack.cloud.security_group_rule:
    cloud: "{{ os_cloud }}"
    security_group: "{{ security_group_name }}"
    protocol: "{{ item.protocol }}"
    port_range_min: "{{ item.port_range_min | default(omit) }}"
    port_range_max: "{{ item.port_range_max | default(omit) }}"
    direction: "{{ item.direction }}"
    state: present
  loop: "{{ security_group_rules }}"

- name: Generate SSH keypair if not present
  community.crypto.openssh_keypair:
    path: "{{ keypair_private_key_path }}"
    type: rsa
    size: 4096
    state: present

- name: Read public key
  ansible.builtin.slurp:
    src: "{{ keypair_public_key_path }}"
  register: pubkey_content

- name: Create OpenStack keypair
  openstack.cloud.keypair:
    cloud: "{{ os_cloud }}"
    name: "{{ keypair_name }}"
    public_key: "{{ pubkey_content.content | b64decode }}"
    state: present

- name: Get image ID
  openstack.cloud.image_info:
    cloud: "{{ os_cloud }}"
    image: "{{ image_name }}"
  register: image_info

- name: Get network ID
  openstack.cloud.networks_info:
    cloud: "{{ os_cloud }}"
    name: "{{ client_network_name }}"
  register: client_network_info

# Delete existing client servers
- name: Delete client servers if they exist
  openstack.cloud.server:
    cloud: "{{ os_cloud }}"
    name: "{{ item }}"
    state: absent
    wait: true
  loop: "{{ client_names }}"
  ignore_errors: true

# Recreate client servers
- name: Create client servers
  openstack.cloud.server:
    cloud: "{{ os_cloud }}"
    name: "{{ item }}"
    image: "{{ image_info.images[0].id }}"
    flavor: "{{ flavor_name }}"
    network: "{{ client_network_info.networks[0].id }}"
    key_name: "{{ keypair_name }}"
    security_groups:
      - "{{ security_group_name }}"
    availability_zone: "{{ client_az }}"
    wait: true
    timeout: 300
    state: present
  loop: "{{ client_names }}"
  register: client_servers

- name: Get client server port IDs
  ansible.builtin.command:
    cmd: openstack port list --os-cloud {{ os_cloud }} --server {{ item }} -f value -c ID
  loop: "{{ client_names }}"
  register: client_ports
  changed_when: false

- name: Check for existing floating IPs on client ports
  ansible.builtin.command:
    cmd: openstack floating ip list --os-cloud {{ os_cloud }} --port {{ item.stdout | trim }} -f value -c "Floating IP Address"
  loop: "{{ client_ports.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: client_existing_fips
  changed_when: false

- name: Create floating IPs for client servers that need one
  ansible.builtin.command:
    cmd: openstack floating ip create --os-cloud {{ os_cloud }} -f value -c floating_ip_address {{ external_network_name }}
  loop: "{{ client_names | zip(client_existing_fips.results) | list }}"
  loop_control:
    label: "{{ item.0 }}"
  when: item.1.stdout | trim == ''
  register: client_new_fips

- name: Assign floating IPs to client servers
  ansible.builtin.command:
    cmd: openstack server add floating ip --os-cloud {{ os_cloud }} {{ item.0 }} {{ item.1.stdout | trim }}
  loop: "{{ client_names | zip(client_new_fips.results) | list }}"
  loop_control:
    label: "{{ item.0 }}"
  when: item.1 is not skipped
  retries: 3
  delay: 10
  register: floating_ip_result
  until: floating_ip_result is not failed

- name: Get client server fixed IPs
  ansible.builtin.shell:
    cmd: openstack port list --os-cloud {{ os_cloud }} --server {{ item }} -f value -c "Fixed IP Addresses" | grep -oP '\d+\.\d+\.\d+\.\d+' | head -1
  loop: "{{ client_names }}"
  register: client_fixed_ips
  changed_when: false

- name: Get client floating IPs for /etc/hosts
  ansible.builtin.command:
    cmd: openstack floating ip list --os-cloud {{ os_cloud }} --fixed-ip-address {{ item.stdout | trim }} -f value -c "Floating IP Address"
  loop: "{{ client_fixed_ips.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: client_hosts_fips
  changed_when: false

- name: Add client entries to /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^.*\\s+{{ item.0 }}$"
    line: "{{ item.1.stdout | trim }} {{ item.0 }}"
    state: present
  loop: "{{ client_names | zip(client_hosts_fips.results) | list }}"
  loop_control:
    label: "{{ item.0 }}"
