---
# Subnet pool
- name: Create subnet pool
  openstack.cloud.subnet_pool:
    cloud: "{{ os_cloud }}"
    name: "{{ subnet_pool_name }}"
    prefixes: "{{ subnet_pool_prefixes }}"
    default_prefix_length: "{{ subnet_pool_default_prefix_length }}"
    is_default: true
    state: present

# Delete existing resources to ensure a clean state
- name: Delete router if it exists
  openstack.cloud.router:
    cloud: "{{ os_cloud }}"
    name: "{{ router_name }}"
    state: absent
  ignore_errors: true

- name: Delete vip subnet if it exists
  openstack.cloud.subnet:
    cloud: "{{ os_cloud }}"
    name: "{{ vip_subnet_name }}"
    state: absent
  ignore_errors: true

- name: Delete vip network if it exists
  openstack.cloud.network:
    cloud: "{{ os_cloud }}"
    name: "{{ vip_network_name }}"
    state: absent
  ignore_errors: true

- name: Delete member subnet if it exists
  openstack.cloud.subnet:
    cloud: "{{ os_cloud }}"
    name: "{{ member_subnet_name }}"
    state: absent
  ignore_errors: true

- name: Delete member network if it exists
  openstack.cloud.network:
    cloud: "{{ os_cloud }}"
    name: "{{ member_network_name }}"
    state: absent
  ignore_errors: true

- name: Delete public subnet if it exists
  openstack.cloud.subnet:
    cloud: "{{ os_cloud }}"
    name: "{{ public_subnet_name }}"
    state: absent
  ignore_errors: true

- name: Delete public network if it exists
  openstack.cloud.network:
    cloud: "{{ os_cloud }}"
    name: "{{ public_network_name }}"
    state: absent
  ignore_errors: true

# Recreate public (external) network
- name: Create public network
  openstack.cloud.network:
    cloud: "{{ os_cloud }}"
    name: "{{ public_network_name }}"
    external: true
    provider_network_type: "{{ public_network_type }}"
    provider_physical_network: "{{ public_network_physical_network }}"
    provider_segmentation_id: "{{ public_network_segment }}"
    state: present

- name: Create public subnet
  openstack.cloud.subnet:
    cloud: "{{ os_cloud }}"
    name: "{{ public_subnet_name }}"
    network: "{{ public_network_name }}"
    cidr: "{{ public_subnet_cidr }}"
    allocation_pool_start: "{{ public_subnet_allocation_pool_start }}"
    allocation_pool_end: "{{ public_subnet_allocation_pool_end }}"
    state: present

# Recreate VIP network (client)
- name: Create vip network
  openstack.cloud.network:
    cloud: "{{ os_cloud }}"
    name: "{{ vip_network_name }}"
    state: present

- name: Create vip subnet
  openstack.cloud.subnet:
    cloud: "{{ os_cloud }}"
    name: "{{ vip_subnet_name }}"
    network: "{{ vip_network_name }}"
    cidr: "{{ vip_subnet_cidr }}"
    dns_nameservers: "{{ dns_nameservers }}"
    state: present

# Recreate member network
- name: Create member network
  openstack.cloud.network:
    cloud: "{{ os_cloud }}"
    name: "{{ member_network_name }}"
    state: present

- name: Create member subnet
  openstack.cloud.subnet:
    cloud: "{{ os_cloud }}"
    name: "{{ member_subnet_name }}"
    network: "{{ member_network_name }}"
    cidr: "{{ member_subnet_cidr }}"
    dns_nameservers: "{{ dns_nameservers }}"
    state: present

# Recreate router
- name: Create router with external gateway
  openstack.cloud.router:
    cloud: "{{ os_cloud }}"
    name: "{{ router_name }}"
    network: "{{ public_network_name }}"
    interfaces:
      - "{{ vip_subnet_name }}"
      - "{{ member_subnet_name }}"
    state: present
