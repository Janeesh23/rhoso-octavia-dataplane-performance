---
# ============================================================
# amphora-http
# ============================================================
- name: "amphora-http: Create load balancer"
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [amphora-http, amphora-http2-clear]
  roles:
    - amphora-http

- name: "amphora-http: Run workloads on client"
  hosts: client
  gather_facts: false
  tags: [amphora-http]
  vars:
    workload_name: amphora-http
    workload_tests:
      - name: http-0b-keepalive
        cmd: "{{ h2load_bin }} -t15 -D120s --warm-up-time 30 -c750 --h1 'http://{{ vip }}/'"
      - name: http-0b-nokeepalive
        cmd: "{{ h2load_bin }} -t15 -n100000 --warm-up-time 30 -c750 --h1 -H 'Connection: close' 'http://{{ vip }}/'"
      - name: http-128b
        cmd: "{{ wrk_bin }} -t15 -d120 -c750 'http://{{ vip }}/?s=128'"
      - name: http-1k
        cmd: "{{ wrk_bin }} -t15 -d120 -c750 'http://{{ vip }}/?s=1k'"
      - name: http-10k
        cmd: "{{ wrk_bin }} -t15 -d120 -c750 'http://{{ vip }}/?s=10k'"
      - name: http-128k
        cmd: "{{ wrk_bin }} -t15 -d120 -c750 'http://{{ vip }}/?s=128k'"
      - name: http-512k
        cmd: "{{ wrk_bin }} -t15 -d120 -c750 'http://{{ vip }}/?s=512k'"
      - name: http-1m
        cmd: "{{ wrk_bin }} -t15 -d120 -c150 'http://{{ vip }}/?s=1m'"
  roles:
    - run-workload

# ============================================================
# amphora-http2-clear (reuses amphora-http LB)
# ============================================================
- name: "amphora-http2-clear: Run workloads on client"
  hosts: client
  gather_facts: false
  tags: [amphora-http2-clear]
  vars:
    workload_name: amphora-http2-clear
    workload_tests:
      - name: http2-clear-0b-keepalive
        cmd: "{{ h2load_bin }} -t15 -D120s --warm-up-time 30 -c750 'http://{{ vip }}/'"
      - name: http2-clear-0b-nokeepalive
        cmd: "{{ h2load_bin }} -t15 -n100000 --warm-up-time 30 -c750 -H 'Connection: close' 'http://{{ vip }}/'"
      - name: http2-clear-128b
        cmd: "{{ h2load_bin }} -t15 -D120s --warm-up-time 30 -c750 'http://{{ vip }}/?s=128'"
      - name: http2-clear-1k
        cmd: "{{ h2load_bin }} -t15 -D120s --warm-up-time 30 -c750 'http://{{ vip }}/?s=1k'"
      - name: http2-clear-10k
        cmd: "{{ h2load_bin }} -t15 -D120s --warm-up-time 30 -c750 'http://{{ vip }}/?s=10k'"
      - name: http2-clear-128k
        cmd: "{{ h2load_bin }} -t15 -D120s --warm-up-time 30 -c750 'http://{{ vip }}/?s=128k'"
      - name: http2-clear-512k
        cmd: "{{ h2load_bin }} -t15 -D120s --warm-up-time 30 -c750 'http://{{ vip }}/?s=512k'"
      - name: http2-clear-1m
        cmd: "{{ h2load_bin }} -t15 -D120s --warm-up-time 30 -c150 'http://{{ vip }}/?s=1m'"
  roles:
    - run-workload

