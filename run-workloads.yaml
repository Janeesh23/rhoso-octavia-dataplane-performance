---
# ============================================================
# amphora-http
# ============================================================
- name: "amphora-http: Create load balancer"
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [amphora-http, amphora-http2-clear]
  roles:
    - amphora-http

- name: "amphora-http: Run workloads on client"
  hosts: client
  gather_facts: false
  tags: [amphora-http]
  vars_files:
    - vars/payload_catalog.yml
  vars:
    workload_name: amphora-http
    workload_tests: >-
      {{ payload_sizes
         | select('in', payload_catalog['amphora-http'])
         | map('extract', payload_catalog['amphora-http'])
         | list }}
  roles:
    - run-workload

# ============================================================
# amphora-http2-clear (reuses amphora-http LB)
# ============================================================
