---
# Payload catalog: maps each generic size name to the exact test command
# per workload. Add new sizes here; enable them in group_vars/all.yml.

payload_catalog:

  amphora-http:
    0b-keepalive:
      name: http-0b-keepalive
      cmd: "{{ h2load_bin }} -t15 -D120s --warm-up-time 30 -c750 --h1 'http://{{ vip }}/'"
    0b-nokeepalive:
      name: http-0b-nokeepalive
      cmd: "{{ h2load_bin }} -t15 -n100000 --warm-up-time 30 -c750 --h1 -H 'Connection: close' 'http://{{ vip }}/'"
    128b:
      name: http-128b
      cmd: "{{ wrk_bin }} -t15 -d120 -c750 'http://{{ vip }}/?s=128'"
    1k:
      name: http-1k
      cmd: "{{ wrk_bin }} -t15 -d120 -c750 'http://{{ vip }}/?s=1k'"
    10k:
      name: http-10k
      cmd: "{{ wrk_bin }} -t15 -d120 -c750 'http://{{ vip }}/?s=10k'"
    128k:
      name: http-128k
      cmd: "{{ wrk_bin }} -t15 -d120 -c750 'http://{{ vip }}/?s=128k'"
    512k:
      name: http-512k
      cmd: "{{ wrk_bin }} -t15 -d120 -c750 'http://{{ vip }}/?s=512k'"
    1m:
      name: http-1m
      cmd: "{{ wrk_bin }} -t15 -d120 -c150 'http://{{ vip }}/?s=1m'"

